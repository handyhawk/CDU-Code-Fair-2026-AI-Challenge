[theme]
base = "light"
primaryColor = "#12304f"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f6f8fa"
textColor = "#1b2733"
# Public Sans: a plain, highly legible typeface used by public-sector design systems.
# Falls back to the system sans-serif if there is no internet connection.
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap, sans-serif"
baseRadius = "small"

[browser]
gatherUsageStats = false
